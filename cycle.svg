<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-labelledby="t d">
  <title id="t">The Brain Relieve loop</title>
  <desc id="d">Braindump leads to Prioritize, Prioritize leads to Execute, Execute leads back to Braindump.</desc>
  <defs>
    <marker id="aT" viewBox="0 0 12 12" refX="8" refY="6" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#2dd4bf"/></marker>
    <marker id="aI" viewBox="0 0 12 12" refX="8" refY="6" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#818cf8"/></marker>
    <marker id="aA" viewBox="0 0 12 12" refX="8" refY="6" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#fbbf24"/></marker>
  </defs>
  <rect width="1000" height="1000" rx="0" fill="#0e1726"/>

  <!-- arcs on a circle around (500,520), radius 320, clockwise -->
  <path d="M 609 219 A 320 320 0 0 1 815 576" fill="none" stroke="#2dd4bf" stroke-width="14" stroke-linecap="round" marker-end="url(#aT)"/>
  <path d="M 706 765 A 320 320 0 0 1 294 765" fill="none" stroke="#818cf8" stroke-width="14" stroke-linecap="round" marker-end="url(#aI)"/>
  <path d="M 185 576 A 320 320 0 0 1 391 219" fill="none" stroke="#fbbf24" stroke-width="14" stroke-linecap="round" marker-end="url(#aA)"/>

  <!-- nodes -->
  <g font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-weight="800" text-anchor="middle">
    <circle cx="500" cy="200" r="112" fill="#2dd4bf"/>
    <text x="500" y="213" font-size="36" fill="#042f2e">Braindump</text>

    <circle cx="777" cy="680" r="112" fill="#818cf8"/>
    <text x="777" y="693" font-size="36" fill="#1e1b4b">Prioritize</text>

    <circle cx="223" cy="680" r="112" fill="#fbbf24"/>
    <text x="223" y="693" font-size="36" fill="#451a03">Execute</text>

    <!-- step numbers -->
    <text x="500" y="62" font-size="22" fill="#2dd4bf" letter-spacing="6">01</text>
    <text x="940" y="694" font-size="22" fill="#818cf8" letter-spacing="6">02</text>
    <text x="62" y="694" font-size="22" fill="#fbbf24" letter-spacing="6">03</text>

    <!-- center -->
    <text x="500" y="512" font-size="44" fill="#f1f5f9">Brain Relieve</text>
    <text x="500" y="556" font-size="24" font-weight="500" fill="#94a3b8">a list that shrinks</text>
  </g>

  <!-- short captions under the loop -->
  <g font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="26" fill="#94a3b8" text-anchor="middle">
    <text x="500" y="918">Everything out. Pick five. Do them. Repeat.</text>
  </g>
</svg>
